name: Bug report
description: Something in HolyArrs isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Security problems go to SECURITY.md instead, not here."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HolyArrs version
      description: Shown in Settings.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker, Docker on a NAS, Unraid, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that helps. Remove API keys and passwords first.
